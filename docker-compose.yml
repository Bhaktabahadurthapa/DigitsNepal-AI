# Local development stack for DigitsNepal AI.
# Start: docker compose up -d db   (add `ai` and `minio` as needed)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: digitsnepal
      POSTGRES_PASSWORD: digitsnepal_dev
      POSTGRES_DB: digitsnepal
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitsnepal"]
      interval: 5s
      retries: 10

  ai:
    build: ./services/ai
    env_file: [./services/ai/.env]
    ports: ["8100:8100"]
    profiles: [ai]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: digitsnepal
      MINIO_ROOT_PASSWORD: digitsnepal_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    profiles: [s3]

volumes:
  dbdata:
  minio:
